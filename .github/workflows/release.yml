name: Build Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the Tauri CLI
        shell: pwsh
        run: |
          cargo install cargo-binstall --locked
          cargo binstall -y "tauri-cli@^2"
          if ($LASTEXITCODE -ne 0) { cargo install tauri-cli --version "^2" --locked }

      - name: Build
        run: cargo tauri build

      - name: Collect the artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" `
                    "out/Nightfall-Blade-Setup.exe"
          Copy-Item "src-tauri/target/release/nightfall-blade.exe" `
                    "out/Nightfall-Blade-Portable.exe"
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-blade-windows
          path: out/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          draft: false
          generate_release_notes: true
